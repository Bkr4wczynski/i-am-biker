resilience4j:
  circuitbreaker:
    instances:
      defaultCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5s

  retry:
    instances:
      defaultRetry:
        maxAttempts: 5
        waitDuration: 1s

  ratelimiter:
    instances:
      defaultRateLimiter:
        limitsForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0

  timelimiter:
    instances:
      defaultTimeLimiter:
        timeoutDuration: 5s
        cancelRunningFuture: true