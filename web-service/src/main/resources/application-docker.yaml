server:
  port: 8000
  servlet:
    context-path: /web

services:
  api-gateway-url: http://api-gateway:8765

jwt:
  secret: ${JWT_SECRET}
  expiration: 360000

spring:
  application:
    name: web-service
  config:
    import: optional:configserver:http://localhost:8888

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    registry-refresh-interval: 10s

resilience4j:
  circuitbreaker:
    instances:
      defaultCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5s

  retry:
    instances:
      defaultRetry:
        maxAttempts: 5
        waitDuration: 1s

  ratelimiter:
    instances:
      defaultRateLimiter:
        limitsForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0

  timelimiter:
    instances:
      defaultTimeLimiter:
        timeoutDuration: 5s
        cancelRunningFuture: true