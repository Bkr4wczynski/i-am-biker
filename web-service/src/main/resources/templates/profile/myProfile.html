<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My profile</title>
    <link rel="stylesheet" th:href="@{/style/style.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">

        <div id="logo">
            <img th:src="@{/images/logo.png}" alt="I am biker"/>
        </div>

        <div id="menu">
            <div class="option"><a th:href="@{/my-profile}">Your profile</a></div>
            <div class="option"><a th:href="@{/my-bikes}">Your bikes</a></div>
            <div class="option"><a th:href="@{/safety-tips}">Safety tips</a></div>
            <div class="option"><a th:href="@{/quiz}">Motorcycle quiz</a></div>

            <div id="logout">
                <form th:action="@{/authentication/logout}" method="post">
                    <button type="submit" id="logoutBtn">Logout</button>
                </form>
            </div>
            <div style="clear:both;"></div>
        </div>

        <div id="content" th:object="${user_details}">
            <h2 th:text="${isBirthday}
                    ? |🎉 Happy birthday, ${user_details.username}!|
                    : |Hello, ${user_details.username}!|">
            </h2>
            <p>Thank you for being with us since: <span th:text="*{registry_date}" ></span>!</p>
            <br>
            <a th:href="@{/settings}">Profile settings</a>
        </div>

        <div id="footer">
            I am biker website. For all motorcyclists from a motorcyclist.
        </div>
    </div>

</body>
</html>
