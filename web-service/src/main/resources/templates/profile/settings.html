<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile settings</title>
    <link rel="stylesheet" th:href="@{/style/side.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <div id="menu">
            <div class="title">Profile settings</div>
            <div class="option"><a th:href="@{/my-profile}">Go back to profile</a></div>
            <div style="clear:both;"></div>
        </div>

        <div id="content">
            <form id="form" method="post" th:action="@{/update-profile}" th:object="${user_details}">
                <input type="hidden" th:field="*{user_id}" />
                <input type="hidden" th:field="*{registry_date}" />
                <label for="username">Username</label>
                <br>
                <input type="text" id="username" th:field="*{username}"/>
                <br>

                <label for="birthday">Birthday</label>
                <br>
                <input type="date" id="birthday" th:field="*{birthday}"/>
                <br>

                <button type="submit">Update</button>
            </form>
        </div>
    </div>
</body>
</html>
