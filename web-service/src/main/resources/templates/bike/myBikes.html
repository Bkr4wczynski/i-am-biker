<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your bikes</title>
    <link rel="stylesheet" th:href="@{/style/style.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
<div id="container">

    <div id="logo">
        <img th:src="@{/images/logo.png}" alt="I am biker"/>
    </div>
    <div id="menu">
        <div class="option"><a th:href="@{/my-profile}">Your profile</a></div>
        <div class="option"><a th:href="@{my-bikes}">Your bikes</a></div>
        <div class="option"><a th:href="@{/safety-tips}">Safety tips</a></div>

        <div id="logout">
            <form th:action="@{/auth/logout}" method="post">
                <button type="submit" id="logoutBtn">Logout</button>
            </form>
        </div>
        <div style="clear:both;"></div>
    </div>

    <div id="header">
        <h1>Your bikes</h1>
    </div>
    <div id="content">
        <ul class="bikesList">
            <li th:each="bike: ${bikes}">
                <a th:text="${bike.model}"
                   th:href="@{/my-bike(id=${bike.id})}"></a>
            </li>
        </ul>
        <br>
        <a th:href="@{/add-bike}">Add new bike</a>
    </div>

    <div id="footer">
        I am biker website. For all motorcyclists from a motorcyclist.
    </div>
</div>

</body>
</html>
