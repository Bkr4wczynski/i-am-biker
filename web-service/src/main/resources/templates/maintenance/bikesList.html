<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your bikes</title>
</head>
<body>
<h2>Your bikes</h2>
<ul>
  <li th:each="bike: ${bikes}">
    <a th:text="${bike.model}"
       th:href="@{/maintenance(id=${bike.id})}"></a>
  </li>
</ul>
</body>
</html>
