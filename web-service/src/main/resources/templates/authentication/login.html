<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/style/side.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <div id="logo">
            <img th:src="@{/images/logo.png}" alt="I am biker"/>
        </div>

        <div id="header">
            <h1>Sign in</h1>
        </div>

        <div id="content">
            <form id="loginForm" th:object="${loginDTO}" th:action="@{/authentication/sign-in}" method="post">
                <label for="username">Username </label>
                <br>
                <input type="text" id="username" th:field="*{username}"/>
                <br>

                <label for="password">Password </label>
                <br>
                <input type="password" id="password" th:field="*{password}"/>

                <br>
                <a th:href="@{/authentication/register}">Don't have account? Register now.</a>

                <br><br>
                <button type="submit">Login</button>
            </form>

            <p style="color: red;" th:text="${errorMessage}"></p>

        </div>

    </div>
</body>
</html>
