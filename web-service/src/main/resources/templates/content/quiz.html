<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Motorcycle quiz</title>
    <link rel="stylesheet" th:href="@{/style/content.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
<div id="container">

    <div id="logo">
        <img th:src="@{/images/logo.png}" alt="I am biker"/>
    </div>

    <div id="menu">
        <div class="option"><a th:href="@{/my-profile}">Your profile</a></div>
        <div class="option"><a th:href="@{/my-bikes}">Your bikes</a></div>
        <div class="option"><a th:href="@{/safety-tips}">Safety tips</a></div>
        <div class="option"><a th:href="@{/quiz}">Motorcycle quiz</a></div>
        <div id="logout">
            <form th:action="@{/auth/logout}" method="post">
                <button type="submit" id="logoutBtn">Logout</button>
            </form>
        </div>
        <div style="clear:both;"></div>
    </div>
    <div id="content">
        <h2>What type of motorcyclist are you?</h2>
        <div id="quiz">
            <h3 id="questionTitle">Question</h3>
            <div id="answerButtons">
                <button class="answer">answer 1</button>
                <button class="answer">answer 2</button>
                <button class="answer">answer 3</button>
                <button class="answer">answer 4</button>
            </div>
            <button id="nextButton">Next</button>

        </div>
    </div>
    <div id="footer">
        I am biker website. For all motorcyclists from a motorcyclist.
    </div>
</div>

<script type="text/javascript" th:src="@{/script/QuizScript.js}"></script>
</body>
</html>
