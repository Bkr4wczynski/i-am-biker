server:
  port: 8200
  servlet:
    context-path: /bikes

spring:
  application:
    name: bikes-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/i_am_biker_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DATASOURCE_USERNAME:biker}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    registry-refresh-interval: 10s

