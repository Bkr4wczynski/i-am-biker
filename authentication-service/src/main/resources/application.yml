server:
  port: 8900
  servlet:
    context-path: /authentication

spring:
  application:
    name: authentication-service
  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/i_am_biker_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DATASOURCE_USERNAME:biker}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    registry-refresh-interval: 10s
