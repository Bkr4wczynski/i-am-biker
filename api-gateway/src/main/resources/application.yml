server:
  port: 8765

jwt:
  secret: 9d5c3687c5dfa48ae9a7799eabf77d3c0de017797d75ed7d82e852ac358a6500
  expiration: 360000

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
      - id: web-service
        uri: lb://WEB-SERVICE
        predicates:
          - Path=/web/**
        filters:
          - AuthenticationFilter

      - id: auth-service
        uri: lb://AUTH-SERVICE
        predicates:
          - Path=/auth/**