server:
  port: 8765

jwt:
  secret: ${JWT_SECRET}
  expiration: 360000

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: web-service
            uri: lb://WEB-SERVICE
            predicates:
              - Path=/web/**

          - id: auth-service
            uri: lb://AUTH-SERVICE
            predicates:
              - Path=/auth/**

          - id: maintenance-service
            uri: lb://MAINTENANCE-SERVICE
            predicates:
              - Path=/maintenance/**
