server:
  port: 8900
  servlet:
    context-path: /auth

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/i_am_biker_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: biker
    password: ${DB_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
