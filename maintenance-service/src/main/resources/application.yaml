server:
  port: 8100

spring:
  application:
    name: maintenance-service
  config:
    import: optional:configserver:http://localhost:8888


eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

resilience4j:
  circuitbreaker:
    instances:
      defaultCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5s

  retry:
    instances:
      defaultRetry:
        maxAttempts: 5
        waitDuration: 1s

  ratelimiter:
    instances:
      defaultRateLimiter:
        limitsForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0

  timelimiter:
    instances:
      defaultTimeLimiter:
        timeoutDuration: 5s
        cancelRunningFuture: true